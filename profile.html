<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Mini Game Hub - Profile</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Your Profile</h1>
    <nav>
      <a href="index.html">Home</a>
      <a href="games.html">Games</a>
      <a href="profile.html">Profile</a>
      <a href="about.html">About</a>
    </nav>
  </header>

  <main>
    <section>
      <h2>Saved Preferences</h2>
      <p id="profileInfo"></p>
    </section>

    <button id="resetProfile">Reset Profile</button>

    <section>
      <h2>Notes</h2>
      <textarea id="notes" rows="5" cols="40" placeholder="Write your notes here..."></textarea>
    </section>

    <section>
      <h2>Game Scores</h2>
      <table>
        <tr><th>Game</th><th>Score</th></tr>
        <tr><td>Guess the Number</td><td id="scoreGuess">0</td></tr>
        <tr><td>Click Counter</td><td id="scoreClick">0</td></tr>
        <tr><td>Trivia Quiz</td><td id="scoreQuiz">0</td></tr>
      </table>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 Mini Game Hub</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
